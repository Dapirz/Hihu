# Checks that Hihu still builds on every push and pull request to main. It builds the debug app
# only: no secrets, no signing, nothing uploaded.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug app
        run: ./gradlew assembleDebug --no-daemon
