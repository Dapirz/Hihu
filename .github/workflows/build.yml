# Checks that Hihu still builds on every push and pull request to main: the debug app, and the
# release app as R8 shrinks it, which needs no key and comes out unsigned. No secrets, nothing
# uploaded. Actions are pinned to commits, so a moved tag cannot change what runs.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request stops the build of the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build the debug and release apps
        run: ./gradlew assembleDebug assembleRelease --no-daemon
